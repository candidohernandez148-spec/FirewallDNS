name: Build Debug (FirewallDNS TUN + smoltcp)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rust-core/**"
      - "android-adapter/**"
      - "dns-engine/**"
      - "engine-runtime/**"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build.yml"
      - ".github/workflows/blank.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK for Rust JNI
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Probar núcleo Rust y transporte smoltcp
        run: cargo test --manifest-path rust-core/Cargo.toml

      - name: Comprobar Rust para Android ARM64
        run: cargo check --manifest-path rust-core/Cargo.toml --target aarch64-linux-android

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"

      - name: Ejecutar pruebas unitarias
        run: gradle testDebugUnitTest test --no-daemon --stacktrace

      - name: Compilar APK FirewallDNS
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verificar motor Rust/JNI en APK FirewallDNS
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libfirewalldns_native.so'
          echo "APK FirewallDNS Debug: motor Rust/JNI ARM64 incluido"

      - uses: actions/upload-artifact@v4
        with:
          name: FirewallDNS-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
