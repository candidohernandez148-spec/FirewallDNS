name: Build Debug (Firestack desde fuentes)

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clonar Firestack
        run: git clone --depth 1 https://github.com/celzero/firestack.git "$RUNNER_TEMP/firestack"

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/firestack/go.mod
          cache: false

      - name: Compilar Firestack (gomobile bind)
        working-directory: ${{ runner.temp }}/firestack
        run: |
          # El Makefile instala gomobile (gomobile init) y lanza:
          # gomobile bind -target=android -androidapi 23 ./intra ...
          make intra
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp build/intra/tun2socks.aar "$GITHUB_WORKSPACE/app/libs/firestack.aar"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK debug
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FirewallDNS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
