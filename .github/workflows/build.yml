name: Build Debug (FirewallDNS TUN + smoltcp)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rust-core/**"
      - "android-adapter/**"
      - "dns-engine/**"
      - "engine-runtime/**"
      - "app/**"
      - "diagnostic-app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build.yml"
      - ".github/workflows/blank.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK for Rust JNI
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Probar núcleo Rust y transporte smoltcp
        run: cargo test --manifest-path rust-core/Cargo.toml

      - name: Comprobar Rust para Android ARM64
        run: cargo check --manifest-path rust-core/Cargo.toml --target aarch64-linux-android

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"

      - name: Ejecutar pruebas unitarias
        run: gradle testDebugUnitTest test --no-daemon --stacktrace

      - name: Compilar APK FirewallDNS y APK de diagnóstico
        run: gradle :app:assembleDebug :diagnostic-app:assembleDebug --no-daemon --stacktrace

      - name: Verificar motor Rust/JNI dentro de ambos APK
        shell: bash
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/debug/app-debug.apk diagnostic-app/build/outputs/apk/debug/diagnostic-app-debug.apk; do
            test -s "$apk"
            if ! unzip -l "$apk" | grep -q 'lib/arm64-v8a/libfirewalldns_native.so'; then
              echo "::error::El APK no contiene el motor nativo ARM64: $apk"
              exit 1
            fi
            echo "Motor Rust/JNI ARM64 incluido: $apk"
          done

      - name: Compilar ambos APK Release
        run: gradle :app:assembleRelease :diagnostic-app:assembleRelease --no-daemon --stacktrace

      - name: Verificar biblioteca nativa y firma compartida en Release
        shell: bash
        run: |
          set -euo pipefail
          MAIN_APK="app/build/outputs/apk/release/app-release.apk"
          DIAGNOSTIC_APK="diagnostic-app/build/outputs/apk/release/diagnostic-app-release.apk"
          for apk in "$MAIN_APK" "$DIAGNOSTIC_APK"; do
            test -s "$apk"
            unzip -l "$apk" | grep -q 'lib/arm64-v8a/libfirewalldns_native.so'
          done
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          MAIN_OUTPUT="$("$APKSIGNER" verify --print-certs "$MAIN_APK" 2>&1)"
          DIAGNOSTIC_OUTPUT="$("$APKSIGNER" verify --print-certs "$DIAGNOSTIC_APK" 2>&1)"
          MAIN_CERT="$(printf '%s\n' "$MAIN_OUTPUT" | awk -F': ' 'tolower($0) ~ /certificate sha-256 digest/ {print $NF; exit}')"
          DIAGNOSTIC_CERT="$(printf '%s\n' "$DIAGNOSTIC_OUTPUT" | awk -F': ' 'tolower($0) ~ /certificate sha-256 digest/ {print $NF; exit}')"
          test -n "$MAIN_CERT"
          test -n "$DIAGNOSTIC_CERT"
          if [[ "$MAIN_CERT" != "$DIAGNOSTIC_CERT" ]]; then
            echo "::error::Los APK Release tienen certificados distintos."
            echo "FirewallDNS: $MAIN_CERT"
            echo "Diagnostic: $DIAGNOSTIC_CERT"
            exit 1
          fi
          echo "Motor ARM64 y certificado compartido verificados: $MAIN_CERT"

      - uses: actions/upload-artifact@v4
        with:
          name: FirewallDNS-apk-bundle
          path: |
            app/build/outputs/apk/debug/*.apk
            diagnostic-app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            diagnostic-app/build/outputs/apk/release/*.apk
