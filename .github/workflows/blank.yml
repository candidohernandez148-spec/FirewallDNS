name: Compilar APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Rust para Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar Android NDK para JNI
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"


      - name: Ejecutar pruebas unitarias
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK FirewallDNS Release
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verificar motor Rust/JNI en FirewallDNS Release
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libfirewalldns_native.so' || {
            echo "::error::El APK Release no contiene el motor nativo ARM64"; exit 1;
          }
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify "$APK"
          echo "APK FirewallDNS Release: motor Rust/JNI ARM64 y firma verificados"

      - name: Subir APK FirewallDNS
        uses: actions/upload-artifact@v7
        with:
          name: FirewallDNS-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
