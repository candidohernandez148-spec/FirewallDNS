name: Compilar APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Rust para Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar Android NDK para JNI
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"

      # Reuse the exact signing JKS that produced previous published APKs.
      # Restore-only: never create or overwrite a cache entry with a new random key.
      - name: Restaurar identidad de firma anterior
        uses: actions/cache/restore@v4
        with:
          path: signing
          key: firewalldns-signing-v1

      - name: Preparar firma de release compartida
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p signing

          if [[ -n "$KEYSTORE_BASE64" ]]; then
            test -n "$KEYSTORE_PASSWORD_SECRET" || { echo "::error::KEYSTORE_PASSWORD es obligatorio cuando se proporciona KEYSTORE_BASE64"; exit 1; }
            test -n "$KEY_ALIAS_SECRET" || { echo "::error::KEY_ALIAS es obligatorio cuando se proporciona KEYSTORE_BASE64"; exit 1; }
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/release.jks
            STORE_PASSWORD="$KEYSTORE_PASSWORD_SECRET"
            KEY_ALIAS_VALUE="$KEY_ALIAS_SECRET"
          else
            # Backward-compatible recovery of the exact keystore used by earlier
            # release APKs. Never generate a replacement signing identity here.
            test -s signing/release.jks || { echo "::error::No hay JKS en la caché anterior ni se configuró KEYSTORE_BASE64"; exit 1; }
            STORE_PASSWORD="${KEYSTORE_PASSWORD_SECRET:-}"
            KEY_ALIAS_VALUE="${KEY_ALIAS_SECRET:-}"
            if [[ -z "$STORE_PASSWORD" && -s signing/password ]]; then STORE_PASSWORD="$(cat signing/password)"; fi
            if [[ -z "$KEY_ALIAS_VALUE" && -s signing/alias ]]; then KEY_ALIAS_VALUE="$(cat signing/alias)"; fi
          fi

          test -s signing/release.jks
          test -n "$STORE_PASSWORD" || { echo "::error::No se pudo recuperar KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS_VALUE" || { echo "::error::No se pudo recuperar KEY_ALIAS"; exit 1; }
          KEY_PASSWORD_VALUE="${KEY_PASSWORD_SECRET:-$STORE_PASSWORD}"

          echo "KEYSTORE_PATH=$PWD/signing/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD_VALUE" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS_VALUE" >> "$GITHUB_ENV"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD_VALUE"

      - name: Ejecutar pruebas unitarias
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar ambos APK Release con la misma firma
        run: |
          gradle :app:assembleRelease :diagnostic-app:assembleRelease --no-daemon --stacktrace

      - name: Verificar motor Rust/JNI dentro de ambos APK Release
        shell: bash
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/release/app-release.apk diagnostic-app/build/outputs/apk/release/diagnostic-app-release.apk; do
            test -s "$apk"
            if ! unzip -l "$apk" | grep -q 'lib/arm64-v8a/libfirewalldns_native.so'; then
              echo "::error::El APK Release no contiene el motor nativo ARM64: $apk"
              exit 1
            fi
            echo "Motor Rust/JNI ARM64 incluido: $apk"
          done

      - name: Verificar certificado compartido entre APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          MAIN_APK="app/build/outputs/apk/release/app-release.apk"
          DIAGNOSTIC_APK="diagnostic-app/build/outputs/apk/release/diagnostic-app-release.apk"
          for apk in "$MAIN_APK" "$DIAGNOSTIC_APK"; do
            if [[ ! -s "$apk" ]]; then
              echo "::error::No se encontró el APK esperado: $apk"
              exit 1
            fi
            "$APKSIGNER" verify "$apk"
          done

          MAIN_OUTPUT="$("$APKSIGNER" verify --print-certs "$MAIN_APK" 2>&1)"
          DIAGNOSTIC_OUTPUT="$("$APKSIGNER" verify --print-certs "$DIAGNOSTIC_APK" 2>&1)"
          echo "Certificado APK FirewallDNS:"
          printf '%s\n' "$MAIN_OUTPUT"
          echo "Certificado APK Diagnostic:"
          printf '%s\n' "$DIAGNOSTIC_OUTPUT"

          MAIN_CERT="$(printf '%s\n' "$MAIN_OUTPUT" | awk -F': ' 'tolower($0) ~ /certificate sha-256 digest/ {print $NF; exit}')"
          DIAGNOSTIC_CERT="$(printf '%s\n' "$DIAGNOSTIC_OUTPUT" | awk -F': ' 'tolower($0) ~ /certificate sha-256 digest/ {print $NF; exit}')"

          if [[ -z "$MAIN_CERT" || -z "$DIAGNOSTIC_CERT" ]]; then
            echo "::error::No se pudo extraer la huella SHA-256 de uno o ambos APK."
            exit 1
          fi
          if [[ "$MAIN_CERT" != "$DIAGNOSTIC_CERT" ]]; then
            echo "::error::Las firmas son diferentes."
            echo "FirewallDNS: $MAIN_CERT"
            echo "Diagnostic: $DIAGNOSTIC_CERT"
            exit 1
          fi
          echo "Certificado compartido verificado: $MAIN_CERT"

      - name: Subir APK FirewallDNS
        uses: actions/upload-artifact@v7
        with:
          name: FirewallDNS-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Subir APK de diagnóstico
        uses: actions/upload-artifact@v7
        with:
          name: FirewallDNS-Diagnostic-APK
          path: diagnostic-app/build/outputs/apk/release/diagnostic-app-release.apk
          if-no-files-found: error
