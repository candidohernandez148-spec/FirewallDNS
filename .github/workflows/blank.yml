name: Compilar APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Rust para Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar Android NDK para JNI
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Checkout Firestack fijado
        uses: actions/checkout@v7
        with:
          repository: celzero/firestack
          ref: c27887056230769ee897b7c7b92976b96d3c9a6d
          path: third_party/firestack

      - name: Aplicar parche FirewallDNS para capturar DNS en puerto 53
        run: git -C third_party/firestack apply "$GITHUB_WORKSPACE/third_party/patches/firestack-capture-dns-port.patch"

      - name: Instalar Go para Firestack
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: third_party/firestack/go.sum

      - name: Verificar parche de captura DNS de Firestack
        working-directory: third_party/firestack
        env:
          GOTOOLCHAIN: local
        run: go test ./intra -run TestCaptureDnsPortEnablesAllPort53Interception -count=1

      - name: Instalar NDK para Firestack
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Compilar AAR Firestack gVisor
        working-directory: third_party/firestack
        env:
          GOTOOLCHAIN: local
        run: |
          make intra
          test -s build/intra/tun2socks.aar
          unzip -l build/intra/tun2socks.aar | grep -q 'jni/arm64-v8a/libgojni.so'

      - name: Instalar AAR Firestack en Android adapter
        run: |
          mkdir -p android-adapter/libs
          cp third_party/firestack/build/intra/tun2socks.aar android-adapter/libs/tun2socks.aar

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"


      # Reuse the exact signing JKS that produced previous published APKs.
      # Restore-only: never create or overwrite a cache entry with a new random key.
      - name: Restaurar identidad de firma anterior
        uses: actions/cache/restore@v4
        with:
          path: signing
          key: firewalldns-signing-v1

      - name: Preparar firma de release compartida
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p signing

          if [[ -n "$KEYSTORE_BASE64" ]]; then
            test -n "$KEYSTORE_PASSWORD_SECRET" || { echo "::error::KEYSTORE_PASSWORD es obligatorio cuando se proporciona KEYSTORE_BASE64"; exit 1; }
            test -n "$KEY_ALIAS_SECRET" || { echo "::error::KEY_ALIAS es obligatorio cuando se proporciona KEYSTORE_BASE64"; exit 1; }
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/release.jks
            STORE_PASSWORD="$KEYSTORE_PASSWORD_SECRET"
            KEY_ALIAS_VALUE="$KEY_ALIAS_SECRET"
          else
            # Backward-compatible recovery of the exact keystore used by earlier
            # release APKs. Never generate a replacement signing identity here.
            test -s signing/release.jks || { echo "::error::No hay JKS en la caché anterior ni se configuró KEYSTORE_BASE64"; exit 1; }
            STORE_PASSWORD="${KEYSTORE_PASSWORD_SECRET:-}"
            KEY_ALIAS_VALUE="${KEY_ALIAS_SECRET:-}"
            if [[ -z "$STORE_PASSWORD" && -s signing/password ]]; then STORE_PASSWORD="$(cat signing/password)"; fi
            if [[ -z "$KEY_ALIAS_VALUE" && -s signing/alias ]]; then KEY_ALIAS_VALUE="$(cat signing/alias)"; fi
          fi

          test -s signing/release.jks
          test -n "$STORE_PASSWORD" || { echo "::error::No se pudo recuperar KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS_VALUE" || { echo "::error::No se pudo recuperar KEY_ALIAS"; exit 1; }
          KEY_PASSWORD_VALUE="${KEY_PASSWORD_SECRET:-$STORE_PASSWORD}"

          echo "KEYSTORE_PATH=$PWD/signing/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD_VALUE" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS_VALUE" >> "$GITHUB_ENV"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD_VALUE"

      - name: Ejecutar pruebas unitarias
        run: gradle :engine-core:test :engine-monitor:test :threat-engine:test :dns-engine:test :engine-runtime:test :android-adapter:testDebugUnitTest :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK FirewallDNS Release
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verificar motor Rust/JNI en FirewallDNS Release
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libfirewalldns_native.so' || {
            echo "::error::El APK Release no contiene el motor Rust ARM64"; exit 1;
          }
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libgojni.so' || {
            echo "::error::El APK Release no contiene Firestack/gVisor ARM64"; exit 1;
          }
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify "$APK"
          echo "APK FirewallDNS Release: motores Rust/JNI + Firestack/gVisor ARM64 y firma verificados"

      - name: Subir APK FirewallDNS
        uses: actions/upload-artifact@v7
        with:
          name: FirewallDNS-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
