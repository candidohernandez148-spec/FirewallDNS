name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Rust para Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar Android NDK para JNI
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"

      - name: Restaurar clave de firma
        id: signing-cache
        uses: actions/cache@v6
        with:
          path: signing
          key: firewalldns-signing-v1

      - name: Preparar firma de release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p signing
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > signing/release.jks
            echo "$KEYSTORE_PASSWORD_SECRET" > signing/password
            echo "$KEY_ALIAS_SECRET" > signing/alias
          elif [[ ! -s signing/release.jks ]]; then
            head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24 > signing/password
            echo firewalldns > signing/alias
            keytool -genkeypair -keystore signing/release.jks -alias firewalldns \
              -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$(cat signing/password)" -keypass "$(cat signing/password)" \
              -dname "CN=Candido y Elizabeth, O=FirewallDNS"
          fi
          echo "KEYSTORE_PATH=$PWD/signing/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$(cat signing/password)" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$(cat signing/alias)" >> "$GITHUB_ENV"
          echo "::add-mask::$(cat signing/password)"

      - name: Ejecutar pruebas unitarias
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar FirewallDNS Release y Diagnostic Debug
        run: |
          gradle :app:assembleRelease :diagnostic-app:assembleDebug --no-daemon --stacktrace

      - name: Subir APK FirewallDNS
        uses: actions/upload-artifact@v7
        with:
          name: FirewallDNS-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Subir APK de diagnóstico
        uses: actions/upload-artifact@v7
        with:
          name: FirewallDNS-Diagnostic-APK
          path: diagnostic-app/build/outputs/apk/debug/diagnostic-app-debug.apk
          if-no-files-found: error
