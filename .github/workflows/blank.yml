name: Compilar APK

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Checkout Firestack fijado
        uses: actions/checkout@v7
        with:
          repository: celzero/firestack
          ref: c27887056230769ee897b7c7b92976b96d3c9a6d
          path: third_party/firestack

      - name: Aplicar parche FirewallDNS para capturar DNS en puerto 53
        run: git -C third_party/firestack apply "$GITHUB_WORKSPACE/third_party/patches/firestack-capture-dns-port.patch"

      - name: Instalar Go para Firestack
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: third_party/firestack/go.sum

      - name: Verificar parche de captura DNS de Firestack
        working-directory: third_party/firestack
        env:
          GOTOOLCHAIN: local
        run: go test ./intra/dnsx -run TestFirewallDNSPortModeInterceptsAnyResolverAddress -count=1

      - name: Instalar NDK para Firestack
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Compilar AAR Firestack gVisor
        working-directory: third_party/firestack
        env:
          GOTOOLCHAIN: local
        run: |
          go test ./intra/dnsx -run TestFirewallDNSPortModeInterceptsAnyResolverAddress -count=1
          make intra
          test -s build/intra/tun2socks.aar
          unzip -l build/intra/tun2socks.aar | grep -q 'jni/arm64-v8a/libgojni.so'

      - name: Instalar AAR Firestack en Android adapter
        run: |
          MAVEN_DIR="build/firestack-maven/com/celzero/firestack/intra/1.0.0"
          mkdir -p "$MAVEN_DIR"
          cp third_party/firestack/build/intra/tun2socks.aar "$MAVEN_DIR/intra-1.0.0.aar"
          cat > "$MAVEN_DIR/intra-1.0.0.pom" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.celzero.firestack</groupId>
            <artifactId>intra</artifactId>
            <version>1.0.0</version>
            <packaging>aar</packaging>
          </project>
          POM

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"


      # Release signing is restricted to trusted runs on main. Never restore
      # private signing material from the Actions cache, which PR workflows can read.
      - name: Preparar firma de release
        id: signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD_SECRET" || -z "$KEY_ALIAS_SECRET" ]]; then
            echo "::notice::Release firmado omitido: configura KEYSTORE_BASE64, KEYSTORE_PASSWORD y KEY_ALIAS con la identidad de publicación existente."
            exit 0
          fi

          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/release.jks
          test -s signing/release.jks
          KEY_PASSWORD_VALUE="${KEY_PASSWORD_SECRET:-$KEYSTORE_PASSWORD_SECRET}"
          keytool -list -keystore signing/release.jks -storepass "$KEYSTORE_PASSWORD_SECRET" -alias "$KEY_ALIAS_SECRET" >/dev/null

          echo "KEYSTORE_PATH=$PWD/signing/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD_VALUE" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
          echo "::add-mask::$KEY_PASSWORD_VALUE"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Ejecutar pruebas unitarias
        run: gradle :engine-core:test :engine-monitor:test :threat-engine:test :dns-engine:test :engine-runtime:test :android-adapter:testDebugUnitTest :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK FirewallDNS Release
        if: steps.signing.outputs.ready == 'true'
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verificar Firestack/gVisor en FirewallDNS Release
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libgojni.so' || {
            echo "::error::El APK Release principal no contiene Firestack/gVisor ARM64"; exit 1;
          }
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify "$APK"
          echo "APK FirewallDNS Release: firma y Firestack/gVisor ARM64 verificados"

      - name: Subir APK FirewallDNS
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: FirewallDNS-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
