name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"

      - name: Preparar firma de release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p signing
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > signing/release.jks
            echo "$KEYSTORE_PASSWORD_SECRET" > signing/password
            echo "$KEY_ALIAS_SECRET" > signing/alias
          elif [[ ! -s signing/release.jks ]]; then
            head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24 > signing/password
            echo firewalldns > signing/alias
            keytool -genkeypair -keystore signing/release.jks -alias firewalldns \
              -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$(cat signing/password)" -keypass "$(cat signing/password)" \
              -dname "CN=Candido y Elizabeth, O=FirewallDNS"
          fi
          echo "KEYSTORE_PATH=$PWD/signing/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$(cat signing/password)" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$(cat signing/alias)" >> "$GITHUB_ENV"
          echo "::add-mask::$(cat signing/password)"

      - name: Compilar Release APK
        run: gradle assembleRelease --no-daemon

      - name: Inspeccionar firmas de Firestack (opcional)
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          GRADLE_CACHE="${GRADLE_USER_HOME:-$HOME/.gradle}"
          AAR="$(find "$GRADLE_CACHE" -type f -iname '*firestack*.aar' -print -quit 2>/dev/null || true)"

          if [[ -z "$AAR" ]]; then
            echo "No se encontró el AAR en la caché; se omite solo la inspección."
            exit 0
          fi

          JAR="/tmp/firestack-classes.jar"
          if ! unzip -p "$AAR" classes.jar > "$JAR" 2>/dev/null; then
            echo "No se pudo extraer classes.jar; se omite solo la inspección."
            exit 0
          fi

          if [[ ! -s "$JAR" ]] || ! jar tf "$JAR" >/dev/null 2>&1; then
            echo "classes.jar está vacío o no es válido; se omite solo la inspección."
            exit 0
          fi

          ALL_CLASSES="$(jar tf "$JAR" |
            grep '\.class$' |
            grep -v '\$' |
            sed 's/\.class$//;s#/#.#g' || true)"

          if [[ -z "$ALL_CLASSES" ]]; then
            echo "No se encontraron clases para inspeccionar."
            exit 0
          fi

          inspect_classes() {
            local label="$1"
            local pattern="$2"
            local classes

            classes="$(printf '%s\n' "$ALL_CLASSES" | grep -E "$pattern" || true)"
            if [[ -z "$classes" ]]; then
              echo "No hay clases coincidentes para: $label"
              return 0
            fi

            echo "Firmas Firestack: $label"
            while IFS= read -r class_name; do
              [[ -z "$class_name" ]] && continue
              javap -classpath "$JAR" "$class_name" || \
                echo "No se pudo inspeccionar: $class_name"
            done <<< "$classes"
          }

          inspect_classes "Bridge/Tunnel" 'Bridge|ServerListener|FlowListener|Intra|Tunnel'
          inspect_classes "Mark/Flow/DNS" 'Mark|FlowSummary|DNSOpts|DNSSummary'
          inspect_classes "Backend" 'Backend$'

      - name: Subir APK Release
        uses: actions/upload-artifact@v7
        with:
          name: FirewallDNS-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
