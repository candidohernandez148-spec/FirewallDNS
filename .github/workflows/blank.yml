name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"

      - name: Restaurar clave de firma
        id: signing-cache
        uses: actions/cache@v6
        with:
          path: signing
          key: firewalldns-signing-v1

      - name: Preparar firma de release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p signing
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > signing/release.jks
            echo "$KEYSTORE_PASSWORD_SECRET" > signing/password
            echo "$KEY_ALIAS_SECRET" > signing/alias
          elif [[ ! -s signing/release.jks ]]; then
            head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24 > signing/password
            echo firewalldns > signing/alias
            keytool -genkeypair -keystore signing/release.jks -alias firewalldns \
              -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$(cat signing/password)" -keypass "$(cat signing/password)" \
              -dname "CN=Candido y Elizabeth, O=FirewallDNS"
          fi
          echo "KEYSTORE_PATH=$PWD/signing/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$(cat signing/password)" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$(cat signing/alias)" >> "$GITHUB_ENV"
          echo "::add-mask::$(cat signing/password)"

      - name: Ejecutar pruebas unitarias
        run: gradle testDebugUnitTest --no-daemon

      - name: Compilar Release APK
        run: gradle assembleRelease --no-daemon

      - name: Subir APK Release
        uses: actions/upload-artifact@v7
        with:
          name: FirewallDNS-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
